<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Robot facing UP (rotated by CSS for other directions) -->
  <!-- antenna -->
  <line x1="50" y1="6" x2="50" y2="18" stroke="#4a5568" stroke-width="4" stroke-linecap="round"/>
  <circle cx="50" cy="6" r="5" fill="#f56565"/>
  <!-- head -->
  <rect x="24" y="18" width="52" height="40" rx="10" fill="#4299e1" stroke="#2b6cb0" stroke-width="3"/>
  <!-- eyes -->
  <circle cx="39" cy="36" r="8" fill="#fff"/>
  <circle cx="61" cy="36" r="8" fill="#fff"/>
  <circle cx="39" cy="34" r="4" fill="#1a202c"/>
  <circle cx="61" cy="34" r="4" fill="#1a202c"/>
  <!-- smile -->
  <path d="M40 48 Q50 54 60 48" stroke="#1a202c" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- body -->
  <rect x="30" y="60" width="40" height="28" rx="8" fill="#63b3ed" stroke="#2b6cb0" stroke-width="3"/>
  <rect x="42" y="68" width="16" height="10" rx="2" fill="#2b6cb0"/>
  <!-- arms -->
  <rect x="14" y="62" width="14" height="10" rx="5" fill="#4299e1" stroke="#2b6cb0" stroke-width="3"/>
  <rect x="72" y="62" width="14" height="10" rx="5" fill="#4299e1" stroke="#2b6cb0" stroke-width="3"/>
  <!-- wheels -->
  <circle cx="38" cy="92" r="6" fill="#4a5568"/>
  <circle cx="62" cy="92" r="6" fill="#4a5568"/>
  <!-- direction marker (small arrow on top of head) -->
  <path d="M50 22 L44 30 L56 30 Z" fill="#fff" opacity="0.9"/>
</svg>
